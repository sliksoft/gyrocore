name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: ["review/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GyroCore + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-dev.txt

      - name: Complete Python test suite
        run: python -m pytest
        env:
          PYTHONPATH: ".:core"

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/gyrocore-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/gyrocore-app/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Desktop unit tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vite production build
        run: npm run build

  integrity:
    name: integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GyroCore + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-dev.txt

      - name: Frozen contract integrity
        run: bash tools/ci/integrity.sh
        env:
          PYTHONPATH: ".:core"
