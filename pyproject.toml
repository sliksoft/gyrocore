[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gyrocore"
version = "0.1.0"
description = "GyroCore analysis/tuning Core library (foundations + Betaflight/CLI + decode/parse)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sliksoft" }]
# WU1–WU3 are intentionally standard-library-only (except system blackbox_decode).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
